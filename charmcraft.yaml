name: certbot
type: charm

description: |
  Acquire certificates from Let's Encrypt and manage them for use by
  related charms.
summary: |
  ACME certificate manager.
title: Certbot subordinate charm
subordinate: true
parts:
  certbot:
    plugin: charm
    source: .
    charm-entrypoint: src/charm.py
platforms:
  #  ubuntu-20.04-amd64:
  #    build-on: [ubuntu@20.04:amd64]
  #    build-for: [ubuntu@20.04:amd64]
  ubuntu-22.04-amd64:
    build-on: [ubuntu@22.04:amd64]
    build-for: [ubuntu@22.04:amd64]
  #ubuntu-24.04-amd64:
  #  build-on: [ubuntu@24.04:amd64]
  #  build-for: [ubuntu@24.04:amd64]
requires:
  juju-info:
    interface: juju-info
    scope: container

config:
  options:
    agree-tos:
      default: false
      description: |
        Agree to the terms-of-service. If using Let's Encrypt these can be
        found at https://letsencrypt.org/repository/
      type: boolean
    cert-path:
      default: ""
      description: |
        Path to which the certificate will be copied. If this path is an
        existing directory then the certificate will be copied into a file
        named <domain>.crt in that directory.
      type: string
    chain-path:
      default: ""
      description: |
        Path to which the certificate chain will be copied. If this path
        is an existing directory then the certificate chain will be copied
        into a file named <domain>_chain.pem in that directory.
      type: string
    combined-path:
      default: ""
      description: |
        Path to which the combined full certificate chain and private key
        will be copied. If this path is an existing directory then the
        combined full certificate chain and key will be copied into a file
        named <domain>.pem in that directory.
      type: string
    deploy-command:
      default: ""
      description: |
        Command to run to deploy a certificate following a successful
        acquisition or renewal.
      type: string
    dns-google-credentials:
      default: ""
      description: |
        Base64 encoded credential file used by the dns-google plugin to
        access the DNS system. For details of this file please see
        https://certbot-dns-google.readthedocs.io/en/stable/#credentials
      type: string
    dns-rfc2136-credentials:
      default: ""
      description: |
        Base64 encoded credential file used by the dns-rfc2136 plugin to
        access the DNS system. For details of this file please see
        https://certbot-dns-rfc2136.readthedocs.io/en/stable/#credentials
      type: string
    dns-route53-aws-access-key-id:
      default: ""
      description: |
        AWS_ACCESS_KEY_ID used by dns-route53 plugin to authenticate
        access to the DNS API. For details please see
        https://certbot-dns-route53.readthedocs.io/en/stable/#credentials
      type: string
    dns-route53-aws-secret-access-key:
      default: ""
      description: |
        AWS_ACCESS_SECRET_KEY used by dns-route53 plugin to authenticate
        access to the DNS API. For details please see
        https://certbot-dns-route53.readthedocs.io/en/stable/#credentials
      type: string
    domains:
      default: ""
      description: |
        The domains to create the certificate for. This comma-separated
        list contains all the domains to add to the certificate. The first
        domain will be the subject of the certificate. Any additional
        names will be added to the certificate as alternative names.
      type: string
    email:
      default: ""
      description: Email address to register the certificates under.
      type: string
    fullchain-path:
      default: ""
      description: |
        Path to which the full certificate chain will be copied. If this
        path is an existing directory then the full certificate chain will
        be copied into a file named <domain>_fullchain.pem in that
        directory.
      type: string
    key-path:
      default: ""
      description: |
        Path to which the private key will be copied. If this path is an
        existing directory then the private key will be copied into a file
        named <domain>.key in that directory.
      type: string
    plugin:
      default: ""
      description: |
        The authenticator plugin to use to obtain (and renew) the
        ceritificate. The currently supported plugins are dns-google,
        dns-rfc2136 & dns-route53. 
      type: string
    propagation-seconds:
      default: 60
      description: |
        The number of seconds to wait for DNS to propagate before asking
        the ACME server to verify the DNS record.
      type: int

actions:
  deploy:
    description: Run the post-renew deploy hook for a domain.
    params:
      domain:
        description: |
          Domain to run the deploy hook for, this must be the primary
          domain on a certificate that has already been acquired by this
          unit.
        type: string
    required: ["domain"]
  get-certificate:
    description: Acquire a certificate from an ACME service.
    params:
      agree-tos:
        description: |
          Agree to the terms-of-service. If using Let's Encrypt these can
          be found at https://letsencrypt.org/repository/. If this is not
          provided the value of agree-tos in the charm configuration will
          be used.
        type: boolean
      aws-access-key-id:
        description: |
          AWS_ACCESS_KEY_ID used to authenticate access to the DNS API
          when using the dns-route53 plugin. For details please see
          https://certbot-dns-route53.readthedocs.io/en/stable/#credentials.
          If this is not provided the value of
          dns-route53-aws-access-key-id in the charm configuration will be
          used.
        type: string
      aws-secret-access-key:
        description: |
          AWS_SECRET_ACCESS_KEY used to authenticate access to the DNS
          API when using the dns-route53 plugin. For details please see
          https://certbot-dns-route53.readthedocs.io/en/stable/#credentials.
          If this is not provided the value of
          dns-route53-aws-secret-access-key in the charm configuration
          will be used.
        type: string
      credentials:
        description: |
          Base64 encoded credential file used by the plugin to access the
          DNS API. The contents of this file will be plugin-specific, see
          the <plugin-name>-credentials fields in the charm configuration
          for more details. If this is not specified then the
          plugin-specific field in the charm configuration will be used.
        type: string
      domains:
        description: |
          The domains to create the certificate for. This comma-separated
          list contains all the domains to add to the certificate. The
          first domain will be the subject of the certificate. Any
          additional values will be added to the certificate as
          alternative names. If this is not provided the value of domain
          in the charm configuration will be used.
        type: string
      email:
        description: |
          Email address to register the certificates under. If this is not
          provided the value of email in the charm configuration will be
          used.
        type: string
      plugin:
        description: |
          Name of the plugin to use to acquire the certificate. If this is
          not specified then the value of plugin in the charm
          configuration will be used.
        type: string
      propagation-seconds:
        description: |
          The number of seconds to wait for DNS to propagate before asking
          the ACME server to verify the DNS record, if appropriate. If
          this is not provided the value of propagation-seconds in the
          charm configuration will be used.

          This option is not supported by the dns-route53 plugin, and will be
          silently ignored if set.
        type: integer
